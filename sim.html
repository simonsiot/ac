<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPhome 模組實體模擬 — Simon IoT</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #111111; }
  body {
    font-family: Roboto, "Noto Sans TC", "Segoe UI", sans-serif;
    background: #111111; color: #e1e1e1;
    -webkit-font-smoothing: antialiased; padding: 0 0 64px;
  }

  /* ===== 頂部品牌分頁 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: #151515; border-bottom: 1px solid rgba(255,255,255,0.10);
    padding: 6px 16px 0;
  }
  .topbar-inner { max-width: 1280px; margin: 0 auto; }
  .topbar h1 {
    font-size: 15px; font-weight: 500; color: #9aa0a6;
    padding: 8px 4px 4px; letter-spacing: 0.2px;
  }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; background: none; border: none;
    border-bottom: 3px solid transparent; padding: 10px 20px 12px;
    cursor: pointer; font-family: inherit; text-align: center;
    color: #8a8a8a; transition: color .15s;
  }
  .tab .zh {
    display: block; font-size: 22px; font-weight: 700; color: #ffffff;
    line-height: 1.2; opacity: 0.55; transition: opacity .15s; white-space: nowrap;
  }
  .tab .en {
    display: block; font-size: 12px; color: #8a8a8a; margin-top: 2px;
    letter-spacing: 0.3px; white-space: nowrap;
  }
  .tab:hover .zh { opacity: 0.85; }
  .tab.active { border-bottom-color: #3b8af8; }
  .tab.active .zh { opacity: 1; }
  .tab.active .en { color: #7cb0f5; }

  .sim-note {
    max-width: 1280px; margin: 16px auto 0; padding: 0 24px;
    font-size: 13px; color: #6f6f6f; line-height: 1.6;
  }

  .topbar .back {
    display: inline-flex; align-items: center; gap: 5px;
    color: #7cb0f5; font-size: 13px; text-decoration: none;
    padding: 4px 4px 6px;
  }
  .topbar .back:hover { text-decoration: underline; }
  .topbar .back .mdi { font-size: 17px; }

  .site-footer {
    max-width: 1280px; margin: 40px auto 0; padding: 24px;
    border-top: 1px solid rgba(255,255,255,0.10);
    text-align: center;
  }
  .site-footer .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #3b8af8; font-size: 14px; font-weight: 500; text-decoration: none;
  }
  .site-footer .back-link:hover { text-decoration: underline; }
  .site-footer .back-link .mdi { font-size: 18px; }
  .site-footer .copyright { color: #6f6f6f; font-size: 12.5px; margin-top: 12px; line-height: 1.6; }
  .layout {
    max-width: 1280px; margin: 18px auto 0; padding: 0 24px;
    display: grid; grid-template-columns: minmax(340px, 430px) 1fr;
    gap: 16px; align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: #1c1c1c; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; overflow: visible;
  }
  .card-title {
    font-size: 24px; font-weight: 400; color: #ffffff;
    letter-spacing: 0.1px; padding: 14px 16px 10px;
  }

  /* ===== 實體列 ===== */
  .row {
    position: relative; display: flex; align-items: center; gap: 16px;
    padding: 9px 16px; min-height: 40px; cursor: default;
  }
  .row:hover { background: rgba(255,255,255,0.045); }
  .row.disabled { opacity: 0.5; }
  .row .icon { font-size: 24px; color: #4d82b0; width: 24px; flex: none; text-align: center; }
  .row .icon.on { color: #ffc107; }
  .row .icon.cool { color: #2196f3; }
  .row .name {
    flex: 1; font-size: 16px; color: #e1e1e1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .tag-off {
    font-size: 11px; color: #8a8a8a; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px; padding: 1px 6px; margin-left: 8px; flex: none;
  }
  .row .state {
    font-size: 14px; color: #d0d0d0; text-align: right;
    white-space: nowrap; flex: none; max-width: 45%;
  }
  .row .state.wrap { white-space: normal; max-width: 42%; line-height: 1.4; }
  .row .state.action { color: #3b8af8; cursor: pointer; }
  .row .state.action:hover { text-decoration: underline; }
  .row .state-2line { text-align: right; flex: none; }
  .row .state-2line .main { font-size: 16px; color: #ffffff; }
  .row .state-2line .sub { font-size: 13px; color: #9b9b9b; margin-top: 2px; }

  .esphome-logo { width: 26px; height: 26px; flex: none; margin: 0 -1px; }

  /* 切換開關 (switch) */
  .toggle {
    width: 40px; height: 22px; border-radius: 11px; background: #555;
    position: relative; cursor: pointer; flex: none; transition: background .15s;
  }
  .toggle.on { background: #3b8af8; }
  .toggle::after {
    content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px; transition: left .15s;
  }
  .toggle.on::after { left: 20px; }

  /* 下拉選擇 (select) */
  .select-ctrl {
    display: inline-flex; align-items: center; gap: 1px;
    color: #ffffff; font-size: 14px; cursor: pointer;
    padding: 5px 6px 5px 12px; border-radius: 8px; flex: none; max-width: 55%;
  }
  .select-ctrl:hover { background: rgba(255,255,255,0.08); }
  .select-ctrl .sv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .select-ctrl .mdi { font-size: 20px; color: #b8b8b8; flex: none; }

  /* ===== Tooltip ===== */
  .tip {
    position: absolute; left: 44px; top: calc(100% - 4px); z-index: 30;
    background: #3a3f47; color: #f1f1f1; font-size: 13.5px; line-height: 1.55;
    padding: 9px 13px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.55);
    max-width: 340px; width: max-content; opacity: 0; visibility: hidden;
    transform: translateY(-2px);
    transition: opacity .15s ease .25s, transform .15s ease .25s, visibility 0s linear .4s;
    pointer-events: none;
  }
  .tip::before {
    content: ""; position: absolute; top: -5px; left: 18px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 6px solid #3a3f47;
  }
  .row:hover .tip {
    opacity: 1; visibility: visible; transform: translateY(2px); transition-delay: .35s;
  }

  .card-footer { border-top: 1px solid rgba(255,255,255,0.12); padding: 14px 16px; }
  .card-footer a {
    color: #3b8af8; font-size: 14px; font-weight: 500;
    text-decoration: none; letter-spacing: 0.2px;
  }
  .card-footer a:hover { text-decoration: underline; }

  /* ===== 裝置資訊卡 ===== */
  .device-info-body { padding: 4px 16px 18px; }
  .device-info-body .line { font-size: 15px; color: #9e9e9e; margin-bottom: 7px; line-height: 1.45; }
  .device-info-body .line a { color: #3b8af8; text-decoration: none; }
  .device-info-body .line a:hover { text-decoration: underline; }
  .integration-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.12); cursor: pointer;
  }
  .integration-row:hover { background: rgba(255,255,255,0.045); }
  .integration-row .int-name { flex: 1; font-size: 16px; color: #e1e1e1; }
  .integration-row .mdi-chevron-right { color: #9b9b9b; font-size: 24px; }
  .device-actions {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.12); padding: 10px 8px 10px 16px;
  }
  .visit-link {
    display: inline-flex; align-items: center; gap: 9px;
    color: #3b8af8; font-size: 14.5px; font-weight: 500; text-decoration: none; cursor: pointer;
  }
  .visit-link .mdi-cog { font-size: 22px; }
  .visit-link .mdi-open-in-new { font-size: 17px; }
  .visit-link:hover { text-decoration: underline; }
  .kebab { color: #c7c7c7; font-size: 24px; padding: 6px 10px; border-radius: 50%; cursor: pointer; }
  .kebab:hover { background: rgba(255,255,255,0.08); }

  .related-head {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px;
  }
  .related-head .card-title { padding: 0; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(59,138,248,0.15); color: #8ab4f8; font-size: 14px; font-weight: 500;
    border: none; border-radius: 18px; padding: 8px 18px; cursor: pointer; font-family: inherit;
  }
  .chip-btn:hover { background: rgba(59,138,248,0.25); }
  .related-body { padding: 12px 16px 20px; font-size: 15px; color: #cfcfcf; line-height: 1.6; }

  #rows-controls .row.climate-row { cursor: pointer; }

  /* row 內下拉選單 */
  .row-menu {
    position: absolute; right: 12px; top: calc(100% - 4px); z-index: 60;
    width: 210px; max-height: 300px; overflow-y: auto;
    background: #2e2e2e; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55); padding: 6px; display: none;
  }
  .row-menu.open { display: block; }

  /* ===== more-info climate 對話框 ===== */
  .dialog-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .dialog-overlay.open { display: flex; }
  .dialog {
    position: relative; width: 100%; max-width: 500px; max-height: 92vh;
    background: #1f1f1f; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  @media (max-width: 540px) { .dialog { max-width: 100%; height: 100%; max-height: 100%; border-radius: 0; } }
  .dialog-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
  .dialog-header .hbtn {
    color: #dcdcdc; font-size: 24px; width: 42px; height: 42px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; flex: none;
  }
  .dialog-header .hbtn:hover { background: rgba(255,255,255,0.09); }
  .dialog-title { flex: 1; min-width: 0; padding-left: 4px; }
  .dialog-title .obj { font-size: 12.5px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog-title .fname { font-size: 21px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog-body { padding: 8px 20px 28px; overflow-y: auto; flex: 1; }

  .dial-wrap { position: relative; width: 320px; max-width: 100%; margin: 8px auto 22px; aspect-ratio: 1; }
  .dial-wrap svg { width: 100%; height: 100%; display: block; }
  .dial-track { fill: none; stroke: #333333; stroke-linecap: round; }
  .dial-active { fill: none; stroke-linecap: round; transition: stroke .2s; }
  .dial-knob { transition: fill .2s; }
  .dial-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  .dial-center .action { font-size: 15px; color: #b7b7b7; margin-bottom: 2px; }
  .dial-center .cur-label { font-size: 17px; color: #cfcfcf; }
  .dial-center .cur-big { font-size: 44px; font-weight: 400; color: #fff; margin-top: 2px; }
  .temp-adjust { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
  .temp-adjust .step {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.09); color: #eaeaea; font-size: 26px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit;
  }
  .temp-adjust .step:hover { background: rgba(255,255,255,0.16); }
  .temp-adjust .target { font-size: 48px; font-weight: 400; color: #fff; min-width: 118px; }
  .temp-adjust .target span { font-size: 22px; color: #bdbdbd; margin-left: 2px; }
  .dial-center .cur-sub { font-size: 14.5px; color: #9a9a9a; margin-top: 10px; }

  .ctrl-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .ctrl-btn {
    position: relative; flex: 1 1 0; min-width: 108px; max-width: 160px;
    background: #2c2c2c; border: none; border-radius: 14px; padding: 14px 10px;
    display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: inherit; text-align: left;
  }
  .ctrl-btn:hover { background: #363636; }
  .ctrl-btn .cb-icon { font-size: 22px; color: #dcdcdc; flex: none; }
  .ctrl-btn .cb-text { min-width: 0; }
  .ctrl-btn .cb-label { font-size: 13px; color: #9a9a9a; line-height: 1.3; }
  .ctrl-btn .cb-value { font-size: 15px; color: #fff; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .opt-menu {
    position: absolute; z-index: 120; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); width: 200px; max-height: 300px; overflow-y: auto;
    background: #2e2e2e; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.55); padding: 6px; display: none;
  }
  .opt-menu.open { display: block; }
  .opt-item {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    border-radius: 10px; cursor: pointer; font-size: 16px; color: #e6e6e6;
  }
  .opt-item:hover { background: rgba(255,255,255,0.06); }
  .opt-item .dot { width: 9px; height: 9px; border-radius: 50%; background: #7a7a7a; flex: none; }
  .opt-item.sel { background: rgba(59,138,248,0.14); color: #64b5f6; font-weight: 500; }
  .opt-item.sel .dot { background: #2196f3; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back" href="esphome.html"><span class="mdi mdi-arrow-left"></span> ESPhome 標準版說明</a>
    <h1>Home Assistant · 裝置頁模擬</h1>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<div class="sim-note" id="sim-note"></div>

<div class="layout">
  <div class="col">
    <div class="card">
      <div class="card-title">裝置資訊</div>
      <div class="device-info-body">
        <div class="line" id="dev-title"></div>
        <div class="line">廠牌：SimonIoT</div>
        <div class="line" id="dev-fw"></div>
        <div class="line">MAC: <a href="javascript:void(0)" id="dev-mac"></a></div>
      </div>
      <div class="integration-row">
        <svg class="esphome-logo" viewBox="0 0 24 24"><path fill="#3b8af8" d="M12 3 2 11h2v9h16v-9h2L12 3zm0 2.5 6 4.8V18H6v-7.7l6-4.8z"/><path fill="#3b8af8" d="M8.5 11.2h7v1.5h-7zM8.5 13.9h7v1.5h-7zM10.2 16.5h3.6V18h-3.6z"/></svg>
        <div class="int-name">ESPHome</div>
        <span class="mdi mdi-chevron-right"></span>
      </div>
      <div class="device-actions">
        <span class="visit-link"><span class="mdi mdi-cog"></span>造訪<span class="mdi mdi-open-in-new"></span></span>
        <span class="kebab mdi mdi-dots-vertical"></span>
      </div>
    </div>
    <div class="card">
      <div class="related-head">
        <div class="card-title">相關</div>
        <button class="chip-btn"><span class="mdi mdi-plus"></span>新增至...</button>
      </div>
      <div class="related-body">還未使用裝置增加任何自動化、腳本或場景。 可按下上方的 + 按鈕進行增加。</div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <div class="card-title">控制</div>
      <div id="rows-controls"></div>
      <div class="card-footer"><a href="javascript:void(0)">增加至儀表板</a></div>
    </div>
    <div class="card">
      <div class="card-title">感測器</div>
      <div id="rows-sensors"></div>
      <div class="card-footer"><a href="javascript:void(0)">增加至儀表板</a></div>
    </div>
    <div class="card">
      <div class="card-title">設定</div>
      <div id="rows-config"></div>
      <div class="card-footer"><a href="javascript:void(0)">增加至儀表板</a></div>
    </div>
    <div class="card">
      <div class="card-title">診斷資料</div>
      <div id="rows-diag"></div>
      <div class="card-footer"><a href="javascript:void(0)">增加至儀表板</a></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <a class="back-link" href="esphome.html"><span class="mdi mdi-arrow-left"></span> 回 ESPhome 標準版說明</a>
  <p class="copyright">本頁為模擬示意，實際實體會依機型與韌體版本略有不同。</p>
  <p class="copyright">&copy; 2025 Simon IoT. All Rights Reserved.</p>
</footer>

<div class="dialog-overlay" id="climate-dialog">
  <div class="dialog">
    <div class="dialog-header">
      <span class="hbtn mdi mdi-close" id="dlg-close" title="關閉"></span>
      <div class="dialog-title"><div class="obj" id="dlg-obj"></div><div class="fname" id="dlg-fname"></div></div>
      <span class="hbtn mdi mdi-chart-box-outline" title="歷史紀錄"></span>
      <span class="hbtn mdi mdi-cog" title="設定"></span>
      <span class="hbtn mdi mdi-dots-vertical" title="更多"></span>
    </div>
    <div class="dialog-body">
      <div class="dial-wrap">
        <svg viewBox="0 0 320 320">
          <path class="dial-track" id="dial-track" stroke-width="20"></path>
          <path class="dial-active" id="dial-active" stroke-width="20"></path>
          <circle class="dial-knob" id="dial-knob" r="13"></circle>
        </svg>
        <div class="dial-center" id="dial-center"></div>
      </div>
      <div class="ctrl-buttons" id="ctrl-buttons"></div>
    </div>
  </div>
</div>

<script>
const ESPHOME_SVG = '<svg class="esphome-logo" viewBox="0 0 24 24"><path fill="#3b8af8" d="M12 3 2 11h2v9h16v-9h2L12 3zm0 2.5 6 4.8V18H6v-7.7l6-4.8z"/><path fill="#3b8af8" d="M8.5 11.2h7v1.5h-7zM8.5 13.9h7v1.5h-7zM10.2 16.5h3.6V18h-3.6z"/></svg>';
const MODE_META = {
  off:       { label: '關閉', icon: 'power',         color: '#8a8a8a', action: '' },
  cool:      { label: '冷氣', icon: 'snowflake',     color: '#2196f3', action: '製冷中' },
  heat:      { label: '暖氣', icon: 'fire',          color: '#ff9800', action: '製熱中' },
  dry:       { label: '除濕', icon: 'water-percent', color: '#26c6da', action: '除濕中' },
  fan_only:  { label: '送風', icon: 'fan',           color: '#00bcd4', action: '送風中' },
  heat_cool: { label: '自動', icon: 'sync',          color: '#4caf50', action: '自動調節' },
};
const SWING_ICON = { '關閉': 'arrow-oscillating-off', '垂直': 'arrow-up-down', '水平': 'arrow-left-right', '兩者': 'arrow-all' };

// ---- 共用 base 實體（每個廠牌都一樣）----
function baseSensors(d) {
  return [
    { icon: 'wifi', name: 'WiFi Signal', state: d.wifi,
      tip: 'Wi-Fi 訊號強度，越接近 0 越好：-50 左右很棒，低於 -75 建議調整分享器或模組位置。' },
    { icon: 'timer-outline', name: 'Uptime', state: d.uptime, tip: '模組這次開機到現在累積的時數。' },
  ];
}
function baseConfig(d) {
  return [
    { svg: true, name: 'Online Firmware Update', state: '已最新',
      tip: '線上韌體更新：有新版時這裡會出現「更新」按鈕，按下就能透過網路更新，不用接電腦。' },
    { icon: 'restart', kind: 'button', name: 'Restart 重開機', state: '按下',
      tip: '把模組重新開機，不會影響冷氣本身設定。模組怪怪的時候可以先試這招。' },
  ];
}
function baseDiag(d) {
  return [
    { icon: 'cloud-search', kind: 'button', name: 'Check Update 檢查韌體更新', state: '按下',

/* ============================ 渲染 ============================ */
let activeIdx = 0;
const brand = () => BRANDS[activeIdx];
const cl = () => brand().climate;

function renderTabs() {
  document.getElementById('tabs').innerHTML = BRANDS.map((b, i) =>
    `<button class="tab ${i === activeIdx ? 'active' : ''}" data-i="${i}"><span class="zh">${b.tab}</span><span class="en">${b.en}</span></button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(t => { t.onclick = () => { activeIdx = +t.dataset.i; renderBrand(); }; });
}

// 依 kind 產生右側控制元件
function rightHtml(e) {
  if (e.kind === 'switch') return `<div class="toggle ${e.on ? 'on' : ''}"></div>`;
  if (e.kind === 'select') return `<div class="select-ctrl"><span class="sv">${e.value}</span><span class="mdi mdi-menu-down"></span></div>`;
  if (e.state2) return `<div class="state-2line"><div class="main">${e.state2[0]}</div><div class="sub">${e.state2[1]}</div></div>`;
  return `<div class="state ${e.kind === 'button' ? 'action' : ''} ${e.wrap ? 'wrap' : ''}">${e.state}</div>`;
}
function rowHtml(e, i) {
  const icon = e.svg ? ESPHOME_SVG : `<span class="mdi mdi-${e.icon} icon ${e.iconClass || ''}"></span>`;
  const tag = e.disabled ? '<span class="tag-off">預設停用</span>' : '';
  const cls = 'row' + (e.disabled ? ' disabled' : '') + (e.climate ? ' climate-row' : '');
  const idx = i === undefined ? '' : ` data-idx="${i}"`;
  return `<div class="${cls}"${idx}>${icon}<div class="name">${e.name}</div>${tag}${rightHtml(e)}<div class="tip">${e.tip}</div></div>`;
}
function renderRows(list, id) { document.getElementById(id).innerHTML = list.map(e => rowHtml(e)).join(''); }

function climateRow() {
  const c = cl(), m = MODE_META[c.mode];
  const hasTarget = c.mode !== 'off' && c.mode !== 'fan_only';
  const sub = hasTarget
    ? `目標 ${c.target.toFixed(1)} °C · 目前 ${c.current.toFixed(1)} °C`
    : `目前狀態: ${c.current.toFixed(1)} °C`;
  return { icon: 'thermostat', iconClass: c.mode === 'off' ? '' : 'cool', climate: true, name: c.name, state2: [m.label, sub],
    tip: '冷氣的主要控制實體。點一下打開溫控面板，可調模式／溫度／風速／擺動，也能加到儀表板變成溫控卡片。' };
}

function controlList() {
  const b = brand();
  return b.climate ? [climateRow(), ...b.controls] : [...b.controls];
}
function renderControls() {
  const list = controlList();
  document.getElementById('rows-controls').innerHTML = list.map((e, i) => rowHtml(e, i)).join('');
  list.forEach((e, i) => {
    const row = document.querySelector(`#rows-controls .row[data-idx="${i}"]`);
    if (!row) return;
    if (e.climate) row.addEventListener('click', openDialog);
    else if (e.kind === 'switch') row.querySelector('.toggle').onclick = ev => { ev.stopPropagation(); e.on = !e.on; renderControls(); };
    else if (e.kind === 'select') row.querySelector('.select-ctrl').onclick = ev => { ev.stopPropagation(); openRowMenu(row, e); };
  });
}

function openRowMenu(row, e) {
  const existing = row.querySelector('.row-menu');
  const wasOpen = existing && existing.classList.contains('open');
  closeMenus();
  if (wasOpen) return;
  const menu = document.createElement('div');
  menu.className = 'row-menu open';
  menu.innerHTML = e.options.map(o =>
    `<div class="opt-item ${o === e.value ? 'sel' : ''}" data-v="${o}"><span class="dot"></span>${o}</div>`
  ).join('');
  menu.querySelectorAll('.opt-item').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); e.value = el.dataset.v; renderControls(); };
  });
  row.appendChild(menu);
}
function closeMenus() {
  document.querySelectorAll('.opt-menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.row-menu').forEach(m => m.remove());
}
document.addEventListener('click', closeMenus);

function renderBrand() {
  const b = brand(), d = b.device;
  renderTabs();
  document.getElementById('sim-note').textContent =
    `模擬畫面：${b.tab}（${b.en}）ESPhome 模組加入 Home Assistant 後的裝置頁。${b.climate ? '點「控制」裡的冷氣可展開溫控面板；' : ''}select 實體可點開下拉、switch 可切換；滑鼠移到任一實體會顯示中文說明。`;
  document.getElementById('dev-title').textContent = d.title;
  document.getElementById('dev-fw').textContent = '韌體：' + d.fw;
  document.getElementById('dev-mac').textContent = d.mac;

  renderControls();
  renderRows([...b.sensors, ...baseSensors(d)], 'rows-sensors');
  renderRows(baseConfig(d), 'rows-config');
  renderRows([...baseDiag(d), ...(b.diagExtra || [])], 'rows-diag');
}

/* ===================== 溫控對話框 ===================== */
const CX = 160, CY = 160, R = 132, START = 135, SWEEP = 270;
function polar(a) { a = a * Math.PI / 180; return [CX + R * Math.cos(a), CY + R * Math.sin(a)]; }
function arcPath(f, t) {
  const [x1, y1] = polar(f), [x2, y2] = polar(t);
  return `M ${x1} ${y1} A ${R} ${R} 0 ${(t - f) > 180 ? 1 : 0} 1 ${x2} ${y2}`;
}
function tempRange() { const c = cl(); return (c.mode === 'heat' && c.heatMax) ? [c.min, c.heatMax] : [c.min, c.max]; }

function renderDial() {
  const c = cl(), m = MODE_META[c.mode];
  const on = c.mode !== 'off', hasTarget = on && c.mode !== 'fan_only';
  document.getElementById('dial-track').setAttribute('d', arcPath(START, START + SWEEP));
  const active = document.getElementById('dial-active'), knob = document.getElementById('dial-knob');
  if (hasTarget) {
    const [min, max] = tempRange(), frac = Math.min(1, Math.max(0, (c.target - min) / (max - min)));
    active.style.display = ''; knob.style.display = '';
    active.setAttribute('d', arcPath(START, START + SWEEP * frac));
    active.setAttribute('stroke', m.color);
    const [kx, ky] = polar(START + SWEEP * frac);
    knob.setAttribute('cx', kx); knob.setAttribute('cy', ky); knob.setAttribute('fill', m.color);
  } else {
    active.style.display = 'none'; knob.style.display = 'none';
  }
  const center = document.getElementById('dial-center');
  if (hasTarget) {
    center.innerHTML = `<div class="action">${m.action}</div>` +
      `<div class="temp-adjust"><button class="step" id="temp-dn">&minus;</button>` +
      `<div class="target">${c.target.toFixed(1)}<span>°C</span></div>` +
      `<button class="step" id="temp-up">+</button></div>` +
      `<div class="cur-sub">目前 ${c.current.toFixed(1)} °C</div>`;
    document.getElementById('temp-up').onclick = () => bumpTemp(0.5);
    document.getElementById('temp-dn').onclick = () => bumpTemp(-0.5);
  } else if (on) {
    center.innerHTML = `<div class="action">${m.action}</div><div class="cur-big">${c.current.toFixed(1)} °C</div><div class="cur-sub">目前溫度</div>`;
  } else {
    center.innerHTML = `<div class="cur-label">目前溫度</div><div class="cur-big">${c.current.toFixed(1)} °C</div>`;
  }
}
function bumpTemp(delta) {
  const c = cl(), [min, max] = tempRange();
  c.target = Math.min(max, Math.max(min, Math.round((c.target + delta) / 0.5) * 0.5));
  renderDial(); syncControlRow();
}

function ctrlBtnHtml(kind, icon, label, value) {
  return `<button class="ctrl-btn" data-kind="${kind}"><span class="cb-icon mdi mdi-${icon}"></span>` +
    `<span class="cb-text"><span class="cb-label">${label}</span><span class="cb-value">${value}</span></span><div class="opt-menu"></div></button>`;
}
function renderButtons() {
  const c = cl();
  const btns = [ctrlBtnHtml('mode', MODE_META[c.mode].icon, '模式', MODE_META[c.mode].label),
                ctrlBtnHtml('fan', 'fan', '風速模式', c.fan)];
  if (c.swingModes) btns.push(ctrlBtnHtml('swing', SWING_ICON[c.swing] || 'arrow-oscillating-off', '擺動模式', c.swing));
  if (c.presets) btns.push(ctrlBtnHtml('preset', 'star-outline', '預設模式', c.preset));
  const wrap = document.getElementById('ctrl-buttons');
  wrap.innerHTML = btns.join('');
  wrap.querySelectorAll('.ctrl-btn').forEach(btn => { btn.onclick = e => { e.stopPropagation(); openDialogMenu(btn); }; });
}
function openDialogMenu(btn) {
  const kind = btn.dataset.kind, menu = btn.querySelector('.opt-menu'), c = cl();
  const wasOpen = menu.classList.contains('open');
  document.querySelectorAll('#ctrl-buttons .opt-menu.open').forEach(m => m.classList.remove('open'));
  if (wasOpen) return;
  let items, current, onPick;
  if (kind === 'mode') { items = c.modes.map(k => ({ v: k, label: MODE_META[k].label })); current = c.mode;
    onPick = v => { c.mode = v; if (c.mode !== 'off' && c.mode !== 'fan_only') { const [mn, mx] = tempRange(); c.target = Math.min(mx, Math.max(mn, c.target || mn)); } renderDial(); renderButtons(); syncControlRow(); }; }
  else if (kind === 'fan') { items = c.fanModes.map(f => ({ v: f, label: f })); current = c.fan; onPick = v => { c.fan = v; renderButtons(); }; }
  else if (kind === 'swing') { items = c.swingModes.map(s => ({ v: s, label: s })); current = c.swing; onPick = v => { c.swing = v; renderButtons(); }; }
  else { items = c.presets.map(p => ({ v: p, label: p })); current = c.preset; onPick = v => { c.preset = v; renderButtons(); }; }
  menu.innerHTML = items.map(it => `<div class="opt-item ${it.v === current ? 'sel' : ''}" data-v="${it.v}"><span class="dot"></span>${it.label}</div>`).join('');
  menu.querySelectorAll('.opt-item').forEach(el => { el.onclick = ev => { ev.stopPropagation(); onPick(el.dataset.v); menu.classList.remove('open'); }; });
  menu.classList.add('open');
}

function syncControlRow() {
  const el = document.querySelector('#rows-controls .climate-row .state-2line');
  if (!el) return;
  const c = cl(), m = MODE_META[c.mode], hasTarget = c.mode !== 'off' && c.mode !== 'fan_only';
  el.querySelector('.main').textContent = m.label;
  el.querySelector('.sub').textContent = hasTarget
    ? `目標 ${c.target.toFixed(1)} °C · 目前 ${c.current.toFixed(1)} °C`
    : `目前狀態: ${c.current.toFixed(1)} °C`;
  const icon = document.querySelector('#rows-controls .climate-row .icon');
  if (icon) icon.className = 'mdi mdi-thermostat icon ' + (c.mode === 'off' ? '' : 'cool');
}

function openDialog() {
  const d = brand().device;
  document.getElementById('dlg-obj').textContent = d.obj;
  document.getElementById('dlg-fname').textContent = cl().name;
  renderDial(); renderButtons();
  document.getElementById('climate-dialog').classList.add('open');
}
function closeDialog() {
  document.querySelectorAll('#ctrl-buttons .opt-menu.open').forEach(m => m.classList.remove('open'));
  document.getElementById('climate-dialog').classList.remove('open');
}
document.getElementById('dlg-close').onclick = closeDialog;
document.getElementById('climate-dialog').addEventListener('click', e => {
  if (e.target.id === 'climate-dialog') closeDialog();
  else if (!e.target.closest('.ctrl-btn')) document.querySelectorAll('#ctrl-buttons .opt-menu.open').forEach(m => m.classList.remove('open'));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });

renderBrand();
